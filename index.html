<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f0e6" />
  <title>Number Lab</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f0e6;
      --bg-2: #efe1cf;
      --surface: rgba(255, 252, 247, 0.82);
      --surface-strong: rgba(255, 252, 247, 0.96);
      --text: #171411;
      --muted: #70675d;
      --faint: rgba(23, 20, 17, 0.08);
      --line: rgba(23, 20, 17, 0.12);
      --line-strong: rgba(23, 20, 17, 0.2);
      --accent: #191714;
      --accent-ink: #f8f1e8;
      --gold: #a67d45;
      --good: #16825a;
      --good-soft: rgba(22, 130, 90, 0.15);
      --bad: #bf3e37;
      --bad-soft: rgba(191, 62, 55, 0.16);
      --shadow: 0 30px 90px rgba(58, 47, 34, 0.18);
      --shadow-soft: 0 16px 42px rgba(58, 47, 34, 0.1);
      --radius-xl: 34px;
      --radius-lg: 24px;
      --time-progress: 100%;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0e0d0b;
      --bg-2: #1b1711;
      --surface: rgba(30, 26, 21, 0.82);
      --surface-strong: rgba(35, 31, 25, 0.96);
      --text: #fff7eb;
      --muted: #b8ab99;
      --faint: rgba(255, 247, 235, 0.08);
      --line: rgba(255, 247, 235, 0.13);
      --line-strong: rgba(255, 247, 235, 0.24);
      --accent: #fff7eb;
      --accent-ink: #11100d;
      --gold: #d1a562;
      --good: #43c78f;
      --good-soft: rgba(67, 199, 143, 0.16);
      --bad: #ef6b62;
      --bad-soft: rgba(239, 107, 98, 0.18);
      --shadow: 0 34px 94px rgba(0, 0, 0, 0.38);
      --shadow-soft: 0 18px 44px rgba(0, 0, 0, 0.26);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 0%, rgba(255, 255, 255, 0.72), transparent 27rem),
        radial-gradient(circle at 84% 94%, rgba(166, 125, 69, 0.24), transparent 28rem),
        linear-gradient(135deg, var(--bg), var(--bg-2));
      transition: background 260ms ease, color 260ms ease;
      overflow-x: hidden;
    }

    :root[data-theme="dark"] body {
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 247, 235, 0.1), transparent 27rem),
        radial-gradient(circle at 84% 94%, rgba(209, 165, 98, 0.18), transparent 28rem),
        linear-gradient(135deg, var(--bg), var(--bg-2));
    }

    button {
      font: inherit;
    }

    .app {
      width: min(100%, 760px);
      min-height: min(760px, calc(100svh - 28px));
      display: grid;
      animation: pageIn 520ms ease both;
    }

    .card {
      position: relative;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(22px, 4svh, 34px);
      overflow: hidden;
      isolation: isolate;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: clamp(18px, 4.8vw, 42px);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
      transition: border-color 260ms ease, background 260ms ease, box-shadow 260ms ease;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(125deg, rgba(255, 255, 255, 0.58), transparent 35%),
        radial-gradient(circle at 82% 8%, rgba(166, 125, 69, 0.14), transparent 19rem);
    }

    :root[data-theme="dark"] .card::before {
      background:
        linear-gradient(125deg, rgba(255, 247, 235, 0.08), transparent 35%),
        radial-gradient(circle at 82% 8%, rgba(209, 165, 98, 0.14), transparent 19rem);
    }

    .card.correctPulse {
      animation: correctPulse 520ms ease;
    }

    .card.wrongPulse {
      animation: wrongPulse 520ms ease;
    }

    .timerArea {
      display: grid;
      gap: 12px;
    }

    .timeRow {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .timeLabel {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 820;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .timeLeft {
      color: var(--text);
      font-size: clamp(1.1rem, 5vw, 1.55rem);
      font-weight: 830;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
    }

    .timeBar {
      height: 11px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--faint);
      border: 1px solid var(--line);
    }

    .timeFill {
      width: var(--time-progress);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      transition: width 80ms linear;
      transform-origin: left center;
    }

    .stage {
      min-height: 0;
      display: grid;
      align-content: center;
      gap: clamp(24px, 6svh, 48px);
    }

    .problem {
      display: grid;
      justify-items: center;
      text-align: center;
      transform-origin: center;
    }

    .problem.enter {
      animation: questionEnter 340ms ease both;
    }

    .question {
      margin: 0;
      font-size: clamp(4.8rem, 24vw, 10rem);
      font-weight: 860;
      letter-spacing: -0.1em;
      line-height: 0.88;
      font-variant-numeric: tabular-nums;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(10px, 2.8vw, 16px);
    }

    .answer {
      position: relative;
      min-height: clamp(76px, 18svh, 116px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.22);
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(58, 47, 34, 0.07);
      font-size: clamp(2rem, 10vw, 4.4rem);
      font-weight: 830;
      letter-spacing: -0.075em;
      font-variant-numeric: tabular-nums;
      transition:
        transform 220ms ease,
        box-shadow 220ms ease,
        background 220ms ease,
        border-color 220ms ease,
        opacity 220ms ease;
      touch-action: manipulation;
    }

    :root[data-theme="dark"] .answer {
      background: rgba(255, 247, 235, 0.055);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
    }

    .answer::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent, rgba(255, 255, 255, 0.46), transparent);
      transform: translateX(-130%);
      transition: transform 520ms ease;
    }

    :root[data-theme="dark"] .answer::after {
      background: linear-gradient(115deg, transparent, rgba(255, 247, 235, 0.13), transparent);
    }

    @media (hover: hover) and (pointer: fine) {
      .answer:hover:not(:disabled) {
        transform: translateY(-4px);
        border-color: var(--line-strong);
        box-shadow: 0 18px 38px rgba(58, 47, 34, 0.13);
      }

      .answer:hover:not(:disabled)::after {
        transform: translateX(130%);
      }
    }

    .answer:active:not(:disabled) {
      transform: scale(0.985);
    }

    .answer.correct {
      border-color: rgba(22, 130, 90, 0.56);
      background: var(--good-soft);
      color: var(--good);
      animation: answerCorrect 520ms ease both;
    }

    .answer.wrong {
      border-color: rgba(191, 62, 55, 0.58);
      background: var(--bad-soft);
      color: var(--bad);
      animation: answerWrong 430ms ease both;
    }

    .answer.dimmed {
      opacity: 0.42;
      transform: scale(0.985);
    }

    .answer:focus-visible,
    .themeOption:focus-visible,
    .primaryAction:focus-visible {
      outline: 3px solid rgba(166, 125, 69, 0.42);
      outline-offset: 3px;
    }

    .resultMark {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 6;
      width: clamp(82px, 24vw, 132px);
      height: clamp(82px, 24vw, 132px);
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--surface-strong);
      color: var(--text);
      box-shadow: var(--shadow);
      font-size: clamp(2.2rem, 11vw, 4.4rem);
      font-weight: 860;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.7);
    }

    .resultMark.show.good {
      color: var(--good);
      animation: markPop 520ms ease both;
    }

    .resultMark.show.bad {
      color: var(--bad);
      animation: markPop 620ms ease both;
    }

    .screenOverlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: clamp(22px, 6vw, 46px);
      background: rgba(255, 252, 247, 0.88);
      backdrop-filter: blur(24px);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.985);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    :root[data-theme="dark"] .screenOverlay {
      background: rgba(35, 31, 25, 0.9);
    }

    .screenOverlay.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .screenPanel {
      width: min(100%, 390px);
      display: grid;
      justify-items: center;
      gap: 18px;
      text-align: center;
      animation: questionEnter 360ms ease both;
    }

    .eyebrow {
      margin: 0;
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 860;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .screenTitle {
      margin: 0;
      color: var(--text);
      font-size: clamp(2.55rem, 15vw, 5.2rem);
      font-weight: 870;
      letter-spacing: -0.09em;
      line-height: 0.9;
    }

    .screenText {
      max-width: 31rem;
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.98rem, 4.2vw, 1.08rem);
      font-weight: 620;
      line-height: 1.55;
      letter-spacing: -0.015em;
    }

    .bestBox,
    .finalBox {
      width: min(100%, 300px);
      display: grid;
      gap: 6px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: var(--shadow-soft);
    }

    :root[data-theme="dark"] .bestBox,
    :root[data-theme="dark"] .finalBox {
      background: rgba(255, 247, 235, 0.055);
    }

    .bestBox span,
    .finalBox span {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 840;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .bestBox strong,
    .finalBox strong {
      color: var(--text);
      font-size: clamp(2.6rem, 14vw, 4.8rem);
      font-weight: 870;
      letter-spacing: -0.09em;
      line-height: 0.88;
      font-variant-numeric: tabular-nums;
    }

    .screenPanel.endPanel {
      min-height: min(520px, 72svh);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
    }

    .scoreResult {
      display: grid;
      justify-items: center;
      gap: 4px;
      margin-top: 4px;
    }

    .scoreResult span,
    .endBest span {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 860;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .scoreResult strong {
      color: var(--text);
      font-size: clamp(5rem, 28vw, 9rem);
      font-weight: 880;
      letter-spacing: -0.1em;
      line-height: 0.82;
      font-variant-numeric: tabular-nums;
    }

    .endBest {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 9px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
    }

    :root[data-theme="dark"] .endBest {
      background: rgba(255, 247, 235, 0.055);
    }

    .endBest strong {
      color: var(--text);
      font-size: 1.08rem;
      font-weight: 850;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .endPanel .primaryAction {
      margin-top: 8px;
    }

    .themeBlock.bottomTheme {
      margin-top: auto;
    }

    .themeBlock.compactTheme {
      width: min(100%, 230px);
      gap: 6px;
    }

    .compactTheme .themeLabel {
      font-size: 0.62rem;
      letter-spacing: 0.13em;
    }

    .compactTheme .themeSwitch {
      gap: 4px;
      padding: 4px;
    }

    .compactTheme .themeOption {
      min-height: 34px;
      font-size: 0.76rem;
      font-weight: 820;
    }

    .themeBlock {
      width: min(100%, 300px);
      display: grid;
      gap: 10px;
    }

    .themeLabel {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 840;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .themeSwitch {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--faint);
    }

    .themeOption {
      min-height: 48px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 800;
      transition: background 220ms ease, color 220ms ease, transform 220ms ease, box-shadow 220ms ease;
    }

    .themeOption[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: var(--shadow-soft);
    }

    .themeOption:active {
      transform: scale(0.965);
    }

    .primaryAction {
      width: min(100%, 300px);
      min-height: 66px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      font-size: clamp(1.04rem, 4.6vw, 1.25rem);
      font-weight: 840;
      letter-spacing: -0.02em;
      transition: transform 220ms ease, box-shadow 220ms ease;
      touch-action: manipulation;
    }

    @media (hover: hover) and (pointer: fine) {
      .primaryAction:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow);
      }
    }

    .primaryAction:active {
      transform: scale(0.975);
    }

    .srOnly {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(14px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes questionEnter {
      from { opacity: 0; transform: translateY(12px) scale(0.985); filter: blur(5px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes answerCorrect {
      0% { transform: scale(1); }
      42% { transform: scale(1.045); }
      100% { transform: scale(1); }
    }

    @keyframes answerWrong {
      0%, 100% { transform: translateX(0); }
      18% { transform: translateX(-8px); }
      36% { transform: translateX(8px); }
      54% { transform: translateX(-6px); }
      72% { transform: translateX(6px); }
    }

    @keyframes correctPulse {
      0% { box-shadow: var(--shadow); }
      44% { box-shadow: 0 0 0 10px var(--good-soft), var(--shadow); }
      100% { box-shadow: var(--shadow); }
    }

    @keyframes wrongPulse {
      0%, 100% { transform: translateX(0); box-shadow: var(--shadow); }
      18% { transform: translateX(-7px); }
      36% { transform: translateX(7px); box-shadow: 0 0 0 10px var(--bad-soft), var(--shadow); }
      54% { transform: translateX(-5px); }
      72% { transform: translateX(5px); }
    }

    @keyframes markPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.68); }
      22% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
      72% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
    }

    @media (min-width: 760px) {
      body {
        padding: 28px;
      }

      .answers {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .answer {
        min-height: 106px;
        font-size: clamp(2rem, 4vw, 3.45rem);
      }
    }

    @media (max-width: 520px) {
      .app {
        min-height: calc(100svh - 28px);
      }

      .card {
        border-radius: 30px;
      }

      .question {
        font-size: clamp(4.2rem, 26vw, 7rem);
      }

      .stage {
        gap: clamp(22px, 5svh, 36px);
      }
    }

    @media (max-width: 380px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 16px;
      }

      .answer {
        min-height: 68px;
        border-radius: 20px;
      }

      .screenPanel {
        gap: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Mental math game">
    <section class="card" id="card" aria-live="polite">
      <div class="resultMark" id="resultMark" aria-hidden="true">✓</div>

      <div class="screenOverlay show" id="screenOverlay" aria-hidden="false">
        <div class="screenPanel" id="screenPanel"></div>
      </div>

      <div class="timerArea" aria-label="Timer">
        <div class="timeRow">
          <span class="timeLabel">Time</span>
          <strong class="timeLeft" id="timeLeft">12.0</strong>
        </div>
        <div class="timeBar" aria-hidden="true"><div class="timeFill" id="timeFill"></div></div>
      </div>

      <div class="stage">
        <div class="problem enter" id="problemBox">
          <h1 class="question" id="question">15 + 20</h1>
        </div>
        <div class="answers" id="answers" role="group" aria-label="Answer choices"></div>
      </div>
    </section>

    <p class="srOnly" id="status" aria-live="assertive">Game ready.</p>
  </main>

  <script>
    (() => {
      "use strict";

      const BEST_KEY = "mentalMathBestScore.v4";
      const THEME_KEY = "mentalMathTheme.v4";
      const NEXT_DELAY = 500;
      const END_DELAY = 850;

      const els = {
        card: document.getElementById("card"),
        screenOverlay: document.getElementById("screenOverlay"),
        screenPanel: document.getElementById("screenPanel"),
        timeLeft: document.getElementById("timeLeft"),
        problemBox: document.getElementById("problemBox"),
        question: document.getElementById("question"),
        answers: document.getElementById("answers"),
        resultMark: document.getElementById("resultMark"),
        status: document.getElementById("status")
      };

      const state = {
        score: 0,
        best: Number(localStorage.getItem(BEST_KEY) || 0),
        current: null,
        accepting: false,
        timerFrame: 0,
        timerStartedAt: 0,
        timerLimitMs: 12000,
        mode: "ready"
      };

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function choose(list) {
        return list[randInt(0, list.length - 1)];
      }

      function shuffle(items) {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = randInt(0, i);
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function setTheme(theme) {
        const safeTheme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = safeTheme;
        localStorage.setItem(THEME_KEY, safeTheme);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", safeTheme === "dark" ? "#0e0d0b" : "#f7f0e6");
        updateThemeButtons();
      }

      function updateThemeButtons() {
        const active = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
        document.querySelectorAll(".themeOption").forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.theme === active));
        });
      }

      function themePicker(options = {}) {
        const compactClass = options.compact ? " compactTheme" : "";
        const bottomClass = options.bottom ? " bottomTheme" : "";
        return `
          <div class="themeBlock${compactClass}${bottomClass}">
            <span class="themeLabel">Background</span>
            <div class="themeSwitch" aria-label="Background theme">
              <button class="themeOption" type="button" data-theme="light" aria-pressed="false">Light</button>
              <button class="themeOption" type="button" data-theme="dark" aria-pressed="false">Dark</button>
            </div>
          </div>
        `;
      }

      function wireOverlayControls() {
        document.querySelectorAll(".themeOption").forEach(button => {
          button.addEventListener("click", () => setTheme(button.dataset.theme));
        });
        const startButton = document.getElementById("startBtn");
        if (startButton) startButton.addEventListener("click", startRun);
        updateThemeButtons();
      }

      function showOverlay() {
        els.screenOverlay.classList.add("show");
        els.screenOverlay.setAttribute("aria-hidden", "false");
      }

      function hideOverlay() {
        els.screenOverlay.classList.remove("show");
        els.screenOverlay.setAttribute("aria-hidden", "true");
      }

      function showStartScreen() {
        stopTimer();
        state.accepting = false;
        state.mode = "ready";
        setTimeProgress(100, getProfile(0).time);
        els.answers.innerHTML = "";
        els.question.textContent = "0 + 0";
        els.screenPanel.className = "screenPanel";
        els.screenPanel.innerHTML = `
          <p class="eyebrow">Number Lab</p>
          <h2 class="screenTitle">I challange you</h2>
          <p class="screenText">Solve addition and subtraction before the timer runs out. Each correct answer makes the next questions harder. One wrong answer ends the run.</p>
          <div class="bestBox" aria-label="Best practice score">
            <span>Best practice</span>
            <strong id="bestScore">${state.best}</strong>
          </div>
          ${themePicker()}
          <button class="primaryAction" id="startBtn" type="button">Start</button>
        `;
        showOverlay();
        wireOverlayControls();
        els.status.textContent = "Game ready.";
      }

      function showEndScreen(finalScore) {
        stopTimer();
        state.accepting = false;
        state.mode = "ended";
        saveBest();
        els.screenPanel.className = "screenPanel endPanel";
        els.screenPanel.innerHTML = `
          <p class="eyebrow">Practice ended</p>
          <div class="scoreResult" aria-label="Final score">
            <span>Score</span>
            <strong>${finalScore}</strong>
          </div>
          <div class="endBest" aria-label="Best practice score">
            <span>Best practice</span>
            <strong>${state.best}</strong>
          </div>
          <button class="primaryAction" id="startBtn" type="button">Start again</button>
          ${themePicker({ compact: true, bottom: true })}
        `;
        showOverlay();
        wireOverlayControls();
        els.status.textContent = `Run ended. Final score ${finalScore}. Best practice ${state.best}.`;
      }

      function startRun() {
        stopTimer();
        clearReaction();
        state.score = 0;
        state.current = null;
        state.accepting = false;
        state.mode = "playing";
        hideOverlay();
        renderProblem();
      }

      function getProfile(score) {
        const step = Math.floor(score / 4);
        const tier = Math.min(step + 1, 18);
        const time = clamp(12.5 - step * 0.45, 5.2, 12.5);
        const negativeAllowed = tier >= 7;
        const mixedDigits = tier >= 8;
        const subtractionBias = clamp(0.34 + tier * 0.028, 0.36, 0.64);

        let min = 0;
        let max = 10;

        if (tier === 1) { min = 0; max = 10; }
        else if (tier === 2) { min = 1; max = 20; }
        else if (tier === 3) { min = 4; max = 35; }
        else if (tier === 4) { min = 8; max = 60; }
        else if (tier === 5) { min = 12; max = 99; }
        else if (tier <= 7) { min = 20; max = 150; }
        else if (tier <= 9) { min = 40; max = 260; }
        else if (tier <= 12) { min = 70; max = 520; }
        else if (tier <= 15) { min = 120; max = 850; }
        else { min = 180; max = 999; }

        return { tier, min, max, time, negativeAllowed, mixedDigits, subtractionBias };
      }

      function makeNumber(profile) {
        let value = randInt(profile.min, profile.max);

        if (profile.tier >= 5 && Math.random() < 0.5) {
          const rounded = Math.round(value / 10) * 10;
          value = clamp(rounded + choose([-3, -2, -1, 1, 2, 3, 7, 8, 9]), profile.min, profile.max);
        }

        if (profile.mixedDigits && Math.random() < 0.35) {
          value = clamp(value + randInt(-19, 19), profile.min, profile.max);
        }

        return value;
      }

      function createProblem() {
        const profile = getProfile(state.score);
        const operation = Math.random() < profile.subtractionBias ? "-" : "+";
        let a = makeNumber(profile);
        let b = makeNumber(profile);

        if (operation === "-" && !profile.negativeAllowed && b > a) {
          [a, b] = [b, a];
        }

        if (operation === "+" && profile.tier <= 2 && Math.random() < 0.3) {
          b = randInt(1, 9);
        }

        const answer = operation === "+" ? a + b : a - b;
        return { a, b, operation, answer, profile };
      }

      function closeOffsets(answer, profile) {
        const magnitude = Math.max(1, Math.abs(answer));
        const tiny = clamp(Math.round(magnitude * 0.025), 1, 14);
        const small = clamp(Math.round(magnitude * 0.05), 2, 28);
        const tier = profile.tier;
        const offsets = new Set();

        [1, 2, 3, 4, 5].forEach(n => {
          offsets.add(n);
          offsets.add(-n);
        });

        [tiny, small, tier, tier + 1, 10, -10].forEach(n => {
          if (n !== 0) {
            offsets.add(n);
            offsets.add(-n);
          }
        });

        if (tier >= 5) {
          [9, 11, 19, 20, 21].forEach(n => {
            offsets.add(n);
            offsets.add(-n);
          });
        }

        return shuffle([...offsets]).filter(n => n !== 0);
      }

      function createChoices(answer, profile) {
        const choices = new Set([answer]);
        const offsets = closeOffsets(answer, profile);
        const maxDistance = clamp(7 + profile.tier * 2.7 + Math.abs(answer) * 0.055, 7, 68);

        for (const offset of offsets) {
          if (choices.size >= 4) break;
          const candidate = answer + offset;
          if (Math.abs(candidate - answer) <= maxDistance) {
            choices.add(candidate);
          }
        }

        let guard = 0;
        while (choices.size < 4 && guard < 100) {
          guard += 1;
          const maxOffset = clamp(3 + profile.tier * 2, 4, 34);
          const offset = randInt(-maxOffset, maxOffset);
          if (offset !== 0) choices.add(answer + offset);
        }

        return shuffle([...choices]);
      }

      function stopTimer() {
        if (state.timerFrame) {
          cancelAnimationFrame(state.timerFrame);
          state.timerFrame = 0;
        }
      }

      function setTimeProgress(percent, seconds) {
        const safePercent = clamp(percent, 0, 100);
        document.documentElement.style.setProperty("--time-progress", `${safePercent}%`);
        els.timeLeft.textContent = seconds.toFixed(1);
      }

      function startTimer(seconds) {
        stopTimer();
        state.timerLimitMs = seconds * 1000;
        state.timerStartedAt = performance.now();
        setTimeProgress(100, seconds);

        const tick = now => {
          if (!state.accepting || state.mode !== "playing") return;
          const elapsed = now - state.timerStartedAt;
          const remainingMs = Math.max(0, state.timerLimitMs - elapsed);
          const percent = (remainingMs / state.timerLimitMs) * 100;
          setTimeProgress(percent, remainingMs / 1000);

          if (remainingMs <= 0) {
            handleTimeout();
            return;
          }

          state.timerFrame = requestAnimationFrame(tick);
        };

        state.timerFrame = requestAnimationFrame(tick);
      }

      function animateQuestion() {
        els.problemBox.classList.remove("enter");
        void els.problemBox.offsetWidth;
        els.problemBox.classList.add("enter");
      }

      function clearReaction() {
        els.card.classList.remove("correctPulse", "wrongPulse");
        els.resultMark.className = "resultMark";
      }

      function showReaction(type) {
        clearReaction();
        void els.card.offsetWidth;
        void els.resultMark.offsetWidth;
        els.card.classList.add(type === "good" ? "correctPulse" : "wrongPulse");
        els.resultMark.textContent = type === "good" ? "✓" : "×";
        els.resultMark.classList.add("show", type);
      }

      function renderProblem() {
        clearReaction();
        hideOverlay();
        state.mode = "playing";
        state.current = createProblem();
        state.accepting = true;

        const { a, b, operation, answer, profile } = state.current;
        const choices = createChoices(answer, profile);

        els.question.textContent = `${a} ${operation} ${b}`;
        els.answers.innerHTML = "";

        choices.forEach((choice, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer";
          button.textContent = String(choice);
          button.dataset.value = String(choice);
          button.setAttribute("aria-label", `Answer ${index + 1}: ${choice}`);
          button.addEventListener("click", () => handleAnswer(button, choice));
          els.answers.appendChild(button);
        });

        animateQuestion();
        startTimer(profile.time);
      }

      function disableAnswers() {
        [...els.answers.children].forEach(button => {
          button.disabled = true;
        });
      }

      function saveBest() {
        if (state.score > state.best) {
          state.best = state.score;
          localStorage.setItem(BEST_KEY, String(state.best));
        }
      }

      function finishRun() {
        const finalScore = state.score;
        window.setTimeout(() => showEndScreen(finalScore), END_DELAY);
      }

      function markCorrectButton(correctAnswer, selectedButton) {
        [...els.answers.children].forEach(button => {
          const isCorrect = Number(button.dataset.value) === correctAnswer;
          if (isCorrect) button.classList.add("correct");
          if (!isCorrect && button !== selectedButton) button.classList.add("dimmed");
        });
      }

      function handleAnswer(button, value) {
        if (!state.accepting || !state.current || state.mode !== "playing") return;
        state.accepting = false;
        stopTimer();
        disableAnswers();

        const isCorrect = value === state.current.answer;

        if (isCorrect) {
          state.score += 1;
          saveBest();
          button.classList.add("correct");
          [...els.answers.children].forEach(other => {
            if (other !== button) other.classList.add("dimmed");
          });
          showReaction("good");
          els.status.textContent = "Correct.";
          window.setTimeout(renderProblem, NEXT_DELAY);
          return;
        }

        button.classList.add("wrong");
        markCorrectButton(state.current.answer, button);
        showReaction("bad");
        els.status.textContent = `Wrong. Correct answer was ${state.current.answer}.`;
        finishRun();
      }

      function handleTimeout() {
        if (!state.accepting || !state.current || state.mode !== "playing") return;
        state.accepting = false;
        stopTimer();
        disableAnswers();
        setTimeProgress(0, 0);
        markCorrectButton(state.current.answer, null);
        showReaction("bad");
        els.status.textContent = `Time expired. Correct answer was ${state.current.answer}.`;
        finishRun();
      }

      document.addEventListener("keydown", event => {
        if ((state.mode === "ready" || state.mode === "ended") && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          const startButton = document.getElementById("startBtn");
          if (startButton) startButton.click();
          return;
        }

        if (!state.accepting || state.mode !== "playing") return;
        if (!["1", "2", "3", "4"].includes(event.key)) return;
        const index = Number(event.key) - 1;
        const button = els.answers.children[index];
        if (button) button.click();
      });

      const savedTheme = localStorage.getItem(THEME_KEY);
      const preferredTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      setTheme(savedTheme || preferredTheme);
      showStartScreen();
    })();
  </script>
</body>
</html>
